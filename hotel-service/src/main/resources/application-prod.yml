eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  file:
    name: /tmp/logs/${spring.application.name}.log

spring:
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET}

auth:
  internal:
    key: ${INTERNAL_API_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
